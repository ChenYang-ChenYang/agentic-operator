# P4-CI-01 — CI pipeline for Agentic Operator.
#
# Triggers on every push and pull request targeting `main`. Each job
# below runs in its own runner so a failure in (say) coverage doesn't
# block the build/docker matrix from giving signal. The single required
# check for branch protection is `ci` (the meta job at the bottom that
# depends on all leafs); see docs/CI.md.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # NO `schedule:` TRIGGER. It used to be `cron: "17 * * * *"`, added so the
  # fresh signed inventory/replay gate would re-run hourly (production
  # promotions do not change the Git SHA, so push alone never re-covers newly
  # promoted artifacts). It was removed because it re-ran the whole matrix
  # hourly while delivering none of that: the only job it existed for,
  # `factory-regression`, is gated on `vars.ENABLE_FACTORY_REGRESSION == 'true'`
  # and that variable is unset, so the gate was skipped in every single
  # scheduled run. The hourly firing therefore only produced a failed run — and
  # a failure notification e-mail to whoever last edited this cron — 24x a day
  # per repo, for as long as `main` stays red.
  #
  # Re-arm it TOGETHER WITH the gate, never alone: register the
  # `[self-hosted, agentic-production-evidence]` runner, set
  # `ENABLE_FACTORY_REGRESSION=true`, and only then restore the cron. Until
  # then use `workflow_dispatch` for an on-demand freshness check.
  workflow_dispatch:

# Cancel in-flight runs of the same workflow on the same ref to save
# minutes. Especially useful on a force-push to a PR branch.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  # Pinned to .nvmrc — the native sqlite binding is compiled per Node
  # major. Any bump here also requires regenerating better-sqlite3.
  NODE_VERSION: "26.5.0"
  PNPM_VERSION: "11.3.0"
  # Tests assume the mock provider so no real API keys are needed.
  LLM_DEFAULT_PROVIDER: mock
  LLM_DEFAULT_MODEL: mock-model-v1
  # Set NODE_ENV=test to opt into the test-time logging level. (apps/api
  # picks this up in src/server.ts.)
  NODE_ENV: test
  SANDBOX_NODE_BASE_IMAGE: docker.io/library/node@sha256:715e55e4b84e4bb0ff48e49b398a848f08e55daed8eb6a0ea1839ae53bc57583
  # Explicit, test-only bootstrap identity. Production seed has no built-in
  # email/name/password; CI supplies all three like any other deployment.
  AGENTIC_BOOTSTRAP_ADMIN_EMAIL: ci-bootstrap-admin@agentic.invalid
  AGENTIC_BOOTSTRAP_ADMIN_NAME: CI Bootstrap Administrator
  AGENTIC_DEV_USER_EMAIL: ci-bootstrap-admin@agentic.invalid

jobs:
  install:
    name: Install + cache
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pnpm-store: ${{ steps.pnpm-cache.outputs.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - id: pnpm-cache
        shell: bash
        run: echo "dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Test Factory sandbox release-manifest fail-closed contract
        run: node --test scripts/factory-sandbox-release-manifest.test.mjs
      - run: pnpm -r typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint

  test-coverage:
    name: Unit + coverage gate
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # apps/api expects data/agentic.db to exist with the latest
      # migrations applied. The seed step makes the test setup
      # deterministic across runs (sqlite is single-file; CI runners are
      # ephemeral).
      - name: Apply migrations + seed
        run: |
          seed_password="$(openssl rand -hex 24)"
          echo "::add-mask::$seed_password"
          export AGENTIC_BOOTSTRAP_ADMIN_PASSWORD="$seed_password"
          echo "AGENTIC_BOOTSTRAP_ADMIN_PASSWORD=$seed_password" >> "$GITHUB_ENV"
          pnpm db:migrate
          pnpm db:seed

      # The test:coverage script invokes vitest run --coverage in each
      # workspace; coverage thresholds (lines >=70 / branches >=60) are
      # encoded in each vitest.config.ts. A miss fails the workspace
      # and turbo propagates the non-zero exit code.
      - name: Run tests with coverage gate
        run: pnpm -r test:coverage

      - name: Upload coverage artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            apps/api/coverage
            apps/web/coverage
            apps/cli/coverage
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
        env:
          AGENTIC_API_URL: http://localhost:3540

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [install, build]
    timeout-minutes: 25
    env:
      # The Playwright e2e config boots `pnpm dev` itself when
      # PW_AUTO_WEBSERVER=1. We pin it on for CI so a missing webServer
      # block doesn't silently make the suite skip.
      PW_AUTO_WEBSERVER: "1"
      # `predev` runs scripts/stop-dev.sh to clear stale workspace dev
      # processes. In CI that stop step matches (and kills) the very
      # `pnpm dev` webServer Playwright just launched — the process exits
      # early and the whole suite fails before a single test runs. Skip
      # the pre-boot cleanup: the CI runner is ephemeral with nothing stale
      # to stop. (The env guard already exists in the root predev script.)
      AGENTIC_SKIP_PREDEV_STOP: "1"
      AUTH_MODE: dev
      AGENTIC_DEV_TENANT: raas
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply migrations + seed
        run: |
          seed_password="$(openssl rand -hex 24)"
          echo "::add-mask::$seed_password"
          export AGENTIC_BOOTSTRAP_ADMIN_PASSWORD="$seed_password"
          echo "AGENTIC_BOOTSTRAP_ADMIN_PASSWORD=$seed_password" >> "$GITHUB_ENV"
          pnpm db:migrate
          pnpm db:seed

      - name: Install Playwright browsers
        run: pnpm --filter @agentic/web exec playwright install --with-deps chromium

      - name: Run E2E suite
        run: pnpm --filter @agentic/web test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Docker buildx (smoke)
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Keep the detection explicit so a packaging regression produces a
      # readable job result instead of a missing-path BuildKit error.
      - name: Detect Dockerfiles
        id: detect
        run: |
          api=$(test -f apps/api/Dockerfile && echo "yes" || echo "no")
          web=$(test -f apps/web/Dockerfile && echo "yes" || echo "no")
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"

      - name: Build apps/api image
        if: steps.detect.outputs.api == 'yes'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: agentic-api:ci

      - name: Build Factory sandbox control image
        if: steps.detect.outputs.api == 'yes'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          target: sandbox-control
          push: false
          load: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          build-args: |
            NODE_BASE_IMAGE=${{ env.SANDBOX_NODE_BASE_IMAGE }}
            AGENTIC_BUILD_ID=${{ github.sha }}
            AGENTIC_SOURCE_REPOSITORY=https://github.com/${{ github.repository }}
          tags: agentic-sandbox-control:ci

      - name: Build Factory sandbox workload image
        if: steps.detect.outputs.api == 'yes'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          target: sandbox-workload
          push: false
          load: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          build-args: |
            NODE_BASE_IMAGE=${{ env.SANDBOX_NODE_BASE_IMAGE }}
            AGENTIC_BUILD_ID=${{ github.sha }}
            AGENTIC_SOURCE_REPOSITORY=https://github.com/${{ github.repository }}
          tags: agentic-sandbox-workload:ci

      - name: Build Factory CodeAct candidate image
        if: steps.detect.outputs.api == 'yes'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          target: codeact-candidate
          push: false
          load: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          build-args: |
            NODE_BASE_IMAGE=${{ env.SANDBOX_NODE_BASE_IMAGE }}
            AGENTIC_BUILD_ID=${{ github.sha }}
            AGENTIC_SOURCE_REPOSITORY=https://github.com/${{ github.repository }}
          tags: agentic-codeact-candidate:ci

      - name: Build Factory production CodeAct executor image
        if: steps.detect.outputs.api == 'yes'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          target: production-codeact-executor
          push: false
          load: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          build-args: |
            NODE_BASE_IMAGE=${{ env.SANDBOX_NODE_BASE_IMAGE }}
            AGENTIC_BUILD_ID=${{ github.sha }}
            AGENTIC_SOURCE_REPOSITORY=https://github.com/${{ github.repository }}
          tags: agentic-production-codeact-executor:ci

      - name: Build Factory sandbox broker gateway image
        if: steps.detect.outputs.api == 'yes'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          target: sandbox-broker-gateway
          push: false
          load: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          build-args: |
            NODE_BASE_IMAGE=${{ env.SANDBOX_NODE_BASE_IMAGE }}
            AGENTIC_BUILD_ID=${{ github.sha }}
            AGENTIC_SOURCE_REPOSITORY=https://github.com/${{ github.repository }}
          tags: agentic-sandbox-gateway:ci

      - name: Verify sandbox image role and source labels
        if: steps.detect.outputs.api == 'yes'
        shell: bash
        run: |
          test "$(docker image inspect agentic-sandbox-control:ci --format '{{ index .Config.Labels "io.agentic.sandbox.role" }}')" = control
          test "$(docker image inspect agentic-sandbox-workload:ci --format '{{ index .Config.Labels "io.agentic.sandbox.role" }}')" = workload
          test "$(docker image inspect agentic-codeact-candidate:ci --format '{{ index .Config.Labels "io.agentic.sandbox.role" }}')" = codeact-candidate
          test "$(docker image inspect agentic-production-codeact-executor:ci --format '{{ index .Config.Labels "io.agentic.sandbox.role" }}')" = production-codeact-executor
          test "$(docker image inspect agentic-sandbox-gateway:ci --format '{{ index .Config.Labels "io.agentic.sandbox.role" }}')" = gateway
          test "$(docker image inspect agentic-sandbox-control:ci --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          test "$(docker image inspect agentic-sandbox-workload:ci --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          test "$(docker image inspect agentic-codeact-candidate:ci --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          test "$(docker image inspect agentic-production-codeact-executor:ci --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          test "$(docker image inspect agentic-production-codeact-executor:ci --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')" = "https://github.com/$GITHUB_REPOSITORY"
          test "$(docker image inspect agentic-sandbox-gateway:ci --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          test "$(docker image inspect agentic-codeact-candidate:ci --format '{{.Config.User}}')" = 65532:65532

      - name: Generate control image SPDX SBOM smoke artifact
        if: steps.detect.outputs.api == 'yes'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: agentic-sandbox-control:ci
          format: spdx-json
          output-file: ${{ runner.temp }}/control.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate workload image SPDX SBOM smoke artifact
        if: steps.detect.outputs.api == 'yes'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: agentic-sandbox-workload:ci
          format: spdx-json
          output-file: ${{ runner.temp }}/workload.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate candidate image SPDX SBOM smoke artifact
        if: steps.detect.outputs.api == 'yes'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: agentic-codeact-candidate:ci
          format: spdx-json
          output-file: ${{ runner.temp }}/candidate.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate production CodeAct executor image SPDX SBOM smoke artifact
        if: steps.detect.outputs.api == 'yes'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: agentic-production-codeact-executor:ci
          format: spdx-json
          output-file: ${{ runner.temp }}/executor.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Block CI on critical production-executor-image vulnerabilities
        if: steps.detect.outputs.api == 'yes'
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          sbom: ${{ runner.temp }}/executor.spdx.json
          fail-build: true
          severity-cutoff: critical
          only-fixed: false
          output-format: json
          output-file: ${{ runner.temp }}/executor.vulnerabilities.json
          cache-db: true

      - name: Generate gateway image SPDX SBOM smoke artifact
        if: steps.detect.outputs.api == 'yes'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: agentic-sandbox-gateway:ci
          format: spdx-json
          output-file: ${{ runner.temp }}/gateway.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Validate generated sandbox SPDX documents
        if: steps.detect.outputs.api == 'yes'
        shell: bash
        run: |
          node -e 'for (const file of process.argv.slice(1)) { const value=require(file); if (value.spdxVersion !== "SPDX-2.3" || !Array.isArray(value.packages) || value.packages.length === 0) throw new Error(`${file} is not a populated SPDX 2.3 document`); }' "${RUNNER_TEMP}/control.spdx.json" "${RUNNER_TEMP}/workload.spdx.json" "${RUNNER_TEMP}/gateway.spdx.json" "${RUNNER_TEMP}/candidate.spdx.json" "${RUNNER_TEMP}/executor.spdx.json"

      - name: Build apps/web image
        if: steps.detect.outputs.web == 'yes'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: |
            AGENTIC_API_URL=http://api:3501
          push: false
          tags: agentic-web:ci

      - name: Note when both Dockerfiles are absent
        if: steps.detect.outputs.api == 'no' && steps.detect.outputs.web == 'no'
        run: |
          echo "::warning::No Dockerfiles found yet (P4-OPS-01 / P4-OPS-02 pending). Skipping docker build."

  # The sibling exporter runs on a production-evidence self-hosted runner for
  # the same main commit. This job waits for that exact workflow/ref/event/SHA,
  # then verifies its HMAC-signed inventory before executing any artifact.
  # Pull requests never download the production-derived bundle.
  factory-regression:
    name: Factory promoted regressions
    # Gated behind the `ENABLE_FACTORY_REGRESSION` repo variable. This job
    # dispatches factory-regression-export.yml, which requires a
    # `[self-hosted, agentic-production-evidence]` runner. That runner is not
    # connected to this repository (every export run sits queued forever and
    # this job just times out), so CI could never go green. Set the repo
    # variable to `true` once the production-evidence runner is registered to
    # re-arm the signed live-inventory replay gate.
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && vars.ENABLE_FACTORY_REGRESSION == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Dispatch a fresh trusted exporter for this CI consumer
        id: export-request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const crypto = require("node:crypto");
            const nonce = crypto.randomBytes(32).toString("hex");
            const attempt = String(process.env.GITHUB_RUN_ATTEMPT);
            const runName = `factory-regression-export/${context.runId}/${attempt}/${nonce}`;
            core.setSecret(nonce);
            core.setOutput("nonce", nonce);
            core.setOutput("run_name", runName);
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "factory-regression-export.yml",
              ref: "main",
              inputs: {
                consumer_workflow: ".github/workflows/ci.yml",
                consumer_run_id: String(context.runId),
                consumer_run_attempt: attempt,
                request_nonce: nonce,
              },
            });

      - name: Build isolated CodeAct image for promoted regression replay
        id: regression-codeact-image
        shell: bash
        run: |
          docker build --pull \
            --file apps/api/Dockerfile \
            --target codeact-candidate \
            --build-arg "NODE_BASE_IMAGE=${SANDBOX_NODE_BASE_IMAGE}" \
            --build-arg "AGENTIC_BUILD_ID=${GITHUB_SHA}" \
            --build-arg "AGENTIC_SOURCE_REPOSITORY=https://github.com/${GITHUB_REPOSITORY}" \
            --tag "agentic-codeact-regression:${GITHUB_SHA}" \
            .
          image_id="$(docker image inspect "agentic-codeact-regression:${GITHUB_SHA}" --format '{{.Id}}')"
          if [[ ! "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Regression CodeAct image is not content-addressed."
            exit 1
          fi
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"

      - name: Wait for the exact trusted exporter run
        id: bundle
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // The trusted exporter itself may legally run for 15 minutes.
            // Give it a cleanup/upload margin instead of timing out first.
            const deadline = Date.now() + 18 * 60 * 1000;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const requestedRunName = `${{ steps.export-request.outputs.run_name }}`;
            while (Date.now() < deadline) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: "factory-regression-export.yml",
                branch: "main",
                per_page: 50,
              });
              const exact = data.workflow_runs.filter((run) =>
                run.head_sha === context.sha &&
                run.head_branch === "main" &&
                run.event === "workflow_dispatch" &&
                run.display_title === requestedRunName &&
                run.path === ".github/workflows/factory-regression-export.yml" &&
                run.head_repository?.full_name === `${owner}/${repo}`
              );
              const passed = exact.find((run) => run.status === "completed" && run.conclusion === "success");
              if (passed) {
                core.setOutput("run_id", String(passed.id));
                core.setOutput("run_attempt", String(passed.run_attempt));
                core.setOutput("event", passed.event);
                core.setOutput("artifact_name", `agent-factory-promoted-regressions-${context.sha}`);
                return;
              }
              const terminal = exact.find((run) => run.status === "completed" && run.conclusion !== "success");
              if (terminal) throw new Error(`Exact Factory exporter run did not succeed (run ${terminal.id}).`);
              await new Promise((resolve) => setTimeout(resolve, 15000));
            }
            throw new Error("Timed out waiting for the exact main/SHA Factory exporter run.");

      - name: Download immutable promoted regression data
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.bundle.outputs.artifact_name }}
          path: ${{ runner.temp }}/agent-factory-promoted-regressions
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.bundle.outputs.run_id }}

      - name: Bind replay to the signed snapshot high-watermark
        id: checkpoint
        shell: bash
        env:
          EXPORT_ROOT: ${{ runner.temp }}/agent-factory-promoted-regressions
        run: |
          node -e 'const fs=require("node:fs"); const path=require("node:path"); const value=JSON.parse(fs.readFileSync(path.join(process.env.EXPORT_ROOT,"factory-regression-export.json"),"utf8")); const state=value?.highWatermark?.stateHash; if (typeof state !== "string" || !/^factory-promotion-high-watermark:v1:[a-f0-9]{64}$/.test(state)) throw new Error("export manifest has no valid high-watermark state hash"); process.stdout.write(`state_hash=${state}\n`);' >> "$GITHUB_OUTPUT"

      - name: Replay every committed promotion without live external calls
        env:
          FACTORY_EXEC_TIER: container
          FACTORY_CONTAINER_IMAGE: ${{ env.SANDBOX_NODE_BASE_IMAGE }}
          FACTORY_EXEC_GENERATED: "1"
          FACTORY_CODEACT_CANDIDATE_IMAGE: ${{ steps.regression-codeact-image.outputs.image_id }}
          FACTORY_CODEACT_ALLOWED_IMAGE_DIGESTS: '["${{ steps.regression-codeact-image.outputs.image_id }}"]'
          FACTORY_CODEACT_DOCKER_SOCKET: /var/run/docker.sock
          FACTORY_REGRESSION_EXPORT_SIGNING_KEY: ${{ secrets.FACTORY_REGRESSION_EXPORT_SIGNING_KEY }}
        run: >-
          pnpm --filter @agentic/api replay:factory-regressions --
          --data-root "${RUNNER_TEMP}/agent-factory-promoted-regressions"
          --export-run-id "${{ steps.bundle.outputs.run_id }}"
          --export-run-attempt "${{ steps.bundle.outputs.run_attempt }}"
          --export-event "${{ steps.bundle.outputs.event }}"
          --expected-ref "refs/heads/main"
          --expected-sha "${{ github.sha }}"
          --consumer-workflow ".github/workflows/ci.yml"
          --consumer-run-id "${{ github.run_id }}"
          --consumer-run-attempt "${{ github.run_attempt }}"
          --request-nonce "${{ steps.export-request.outputs.nonce }}"
          --expected-high-watermark-state-hash "${{ steps.checkpoint.outputs.state_hash }}"

  # Meta gate — branch protection should require *this* job, which is
  # green only when every leaf above is green. Adding new jobs above
  # automatically tightens the protection once they're listed here.
  ci:
    name: CI
    if: always()
    needs:
      [typecheck, lint, test-coverage, build, e2e, docker, factory-regression]
    runs-on: ubuntu-latest
    steps:
      - name: Fail when any required leaf failed
        if: |
          needs.typecheck.result != 'success' ||
          needs.lint.result != 'success' ||
          needs.test-coverage.result != 'success' ||
          needs.build.result != 'success' ||
          needs.e2e.result != 'success' ||
          needs.docker.result != 'success' ||
          (needs.factory-regression.result != 'success' && needs.factory-regression.result != 'skipped')
        run: |
          echo "One or more required leaf jobs failed."
          echo "typecheck=${{ needs.typecheck.result }}"
          echo "lint=${{ needs.lint.result }}"
          echo "test-coverage=${{ needs.test-coverage.result }}"
          echo "build=${{ needs.build.result }}"
          echo "e2e=${{ needs.e2e.result }}"
          echo "docker=${{ needs.docker.result }}"
          echo "factory-regression=${{ needs.factory-regression.result }}"
          exit 1
      - name: Report missing persistent Factory evidence
        if: github.event_name == 'pull_request' && needs.factory-regression.result == 'skipped'
        run: |
          echo "::notice::Pull-request CI intentionally did not download production-derived Factory evidence. The required main check performs the signed live-inventory replay after merge."
      - name: Summary
        run: |
          if [ "${{ needs.factory-regression.result }}" = "success" ]; then
            echo "All CI leaves passed, including every committed Agent Factory promotion in the supplied evidence bundle."
          else
            echo "Core pull-request CI leaves passed; the signed production replay remains a required main-only check."
          fi
